name: Greenhouse CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10"]

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint Python files
        run: |
          flake8 frontend/streamlit_app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        env:
          MONGO_URI: mongodb://localhost:27017/testdb
          DB_NAME: testdb
          OPENWEATHER_API_KEY: dummy_key
        run: |
          pytest || echo "No tests found yet"

      - name: Streamlit smoke test
        working-directory: frontend/streamlit_app
        run: |
          timeout 20s streamlit run pages/1_zone1.py --server.headless true || code=$?
          if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 124 ]; then
            exit $code
          fi